<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inbox Tester</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">DELIVERABILITY LAB</p>
        <h1>Inbox Tester</h1>
        <p class="sub">Configure your IMAP mailboxes and check where your emails land.</p>
      </div>
    </header>

    <section class="card">
      <div class="section-title">IMAP Mailbox 1</div>
      <div class="form-grid">
        <label>Email
          <input id="b1_email" type="email" placeholder="user@gmail.com">
        </label>
        <label>IMAP Host
          <input id="b1_host" type="text" placeholder="imap.gmail.com">
        </label>
        <label>Port
          <input id="b1_port" type="number" value="993">
        </label>
        <label>
          <input id="b1_secure" type="checkbox" checked> SSL/TLS
        </label>
        <label>Username
          <input id="b1_user" type="text" placeholder="user@gmail.com">
        </label>
        <label>Password / App Password
          <input id="b1_pass" type="password" placeholder="xxxx xxxx xxxx xxxx">
        </label>
      </div>
    </section>

    <section class="card">
      <div class="section-title">IMAP Mailbox 2</div>
      <div class="form-grid">
        <label>Email
          <input id="b2_email" type="email" placeholder="user2@gmail.com">
        </label>
        <label>IMAP Host
          <input id="b2_host" type="text" placeholder="imap.gmail.com">
        </label>
        <label>Port
          <input id="b2_port" type="number" value="993">
        </label>
        <label>
          <input id="b2_secure" type="checkbox" checked> SSL/TLS
        </label>
        <label>Username
          <input id="b2_user" type="text" placeholder="user2@gmail.com">
        </label>
        <label>Password / App Password
          <input id="b2_pass" type="password" placeholder="xxxx xxxx xxxx xxxx">
        </label>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Check Inbox</div>
      <label>Email subject to search
        <input id="subject" type="text" placeholder="Your email subject line">
      </label>
      <label>Search within last
        <input id="hours" type="number" value="24" min="1" placeholder="24">
        <small class="hint">hours</small>
      </label>
      <div class="actions">
        <button id="check">Check now</button>
        <span id="message"></span>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <div class="section-title">Results</div>
      </div>
      <div id="results" class="empty">Configure mailboxes above, then check.</div>
    </section>

    <footer>
      Your credentials stay in your browser (localStorage). Nothing is stored on any server.
      <div class="credit">by 𝐍𝐚𝐝𝐚 𝐇𝐝𝐢𝐦𝐚𝐧𝐞 [WMN5]</div>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
